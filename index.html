<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACSC Detective Check List 2026 — Professional Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--border:#e5e9f2;
  --text:#0f172a;--muted:#64748b;--primary:#2563eb;--primary-d:#1d4ed8;
  --accent:#0ea5e9;--success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --g1:#3b82f6;--g2:#8b5cf6;--g3:#ef4444;--g4:#0d9488;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 8px 30px rgba(15,23,42,.12);
  --radius:12px;
}
[data-theme="dark"]{
  --bg:#0b1020;--surface:#121933;--surface-2:#0f1530;--border:#1f2a4a;
  --text:#e8ecf7;--muted:#94a3b8;--primary:#60a5fa;--primary-d:#3b82f6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

/* ===== MOBILE & TABLET ===== */
.sidebar-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background:rgba(15,23,42,.6);z-index:998;opacity:0;transition:opacity .25s}
.sidebar-backdrop.show{display:block;opacity:1}
body.no-scroll{overflow:hidden;position:fixed;width:100%}

@media(max-width:980px){
  .app{display:block;grid-template-columns:none}
  .sidebar{
    position:fixed!important;
    left:-100%;top:0;bottom:0;
    width:min(320px,88vw);
    height:100vh;height:100dvh;
    z-index:999;
    transition:left .28s ease;
    box-shadow:none;
  }
  .sidebar.open{
    left:0;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }
  .main{
    width:100%;
    min-width:0;
    margin-left:0;
  }
  .menu-btn{display:inline-flex!important}
  .topbar{padding:10px 12px;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topbar::-webkit-scrollbar{display:none}
  .topbar{scrollbar-width:none}
  .topbar .btn{padding:8px 10px;font-size:12px;flex-shrink:0;white-space:nowrap}
  .topbar .btn .label{display:none}
  .topbar .icon-btn{width:36px;height:36px}
  .case-meta{flex:1 1 auto;min-width:0;order:0}
  .case-meta h2{font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .case-meta .crumb{font-size:10px}
  .content{padding:14px 12px 100px}
  .section > h3{padding:11px 14px;font-size:13px}
  .section .body{padding:12px 14px}
  .progress-bar{padding:12px;gap:10px;flex-wrap:wrap}
  .progress-bar .stat b{font-size:18px}
  .progress-bar .bar{flex-basis:100%;order:3}
  .dash{grid-template-columns:repeat(2,1fr);gap:10px}
  .dash-card{padding:12px}
  .dash-card .val{font-size:20px}
  .dash-card .lbl{font-size:10px}
  table.data{font-size:12px;min-width:480px}
  table.data th, table.data td{padding:7px 8px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chk-text .title{font-size:13px}
  .chk-text .desc{font-size:12px}
  .chk-box{width:24px;height:24px}
  .scenario{font-size:13px;line-height:1.7}
  .tag{font-size:10px;padding:2px 6px}
  .disclaimer{font-size:11px;padding:9px 12px}
  .case-item{padding:11px 12px}
  .case-item .ttl{font-size:13px}
}

@media(max-width:480px){
  .topbar{padding:8px 10px;gap:5px}
  .topbar .btn{padding:7px 9px;font-size:11px}
  .topbar .icon-btn{width:34px;height:34px;font-size:14px}
  .case-meta h2{font-size:13px}
  .case-meta h2 .tag{display:none}
  .content{padding:12px 10px 100px}
  .progress-bar{padding:10px}
  .progress-bar .stat b{font-size:16px}
  .brand h1{font-size:14px}
  .brand{padding:14px 14px 10px}
  .section{margin-bottom:14px}
  .section > h3 .ix{width:22px;height:22px;font-size:11px}
  .add-row{font-size:11px;padding:6px 10px}
  .mini-btn{font-size:10px}
}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--muted);margin-top:4px}
.brand .badge{display:inline-block;font-size:10px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:3px 8px;border-radius:999px;margin-top:8px;font-weight:600}
.search-wrap{padding:12px;border-bottom:1px solid var(--border)}
.search-wrap input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--primary)}
.case-list{flex:1;overflow-y:auto;padding:8px 6px}
.group-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px;font-weight:700;display:flex;align-items:center;gap:6px}
.group-title .dot{width:8px;height:8px;border-radius:50%}
.case-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .15s;margin:1px 4px;border:1px solid transparent}
.case-item:hover{background:var(--surface-2)}
.case-item.active{background:linear-gradient(90deg,rgba(37,99,235,.08),transparent);border-color:rgba(37,99,235,.2);font-weight:600}
.case-item .code{font-size:10px;color:var(--muted);font-weight:700;min-width:30px}
.case-item .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-item .pct{font-size:10px;color:var(--muted);font-weight:600}
.progress-mini{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:3px;width:36px}
.progress-mini > i{display:block;height:100%;background:linear-gradient(90deg,var(--success),var(--primary));transition:width .3s}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* MAIN */
.main{padding:0;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
[data-theme="dark"] .topbar{background:rgba(18,25,51,.85)}
.menu-btn{display:none;background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;cursor:pointer;align-items:center;justify-content:center}
.case-meta{flex:1;min-width:0}
.case-meta h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
.tag.g1{background:rgba(59,130,246,.12);color:var(--g1)}
.tag.g2{background:rgba(139,92,246,.12);color:var(--g2)}
.tag.g3{background:rgba(239,68,68,.12);color:var(--g3)}
.tag.g4{background:rgba(13,148,136,.12);color:var(--g4)}
.case-meta .crumb{font-size:12px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--danger);border-color:rgba(220,38,38,.3)}
.btn.danger:hover{background:rgba(220,38,38,.08)}
.btn .ico{font-size:14px}
.icon-btn{width:38px;height:38px;padding:0;justify-content:center;font-size:16px}

/* CONTENT */
.content{padding:20px 24px 60px;max-width:1200px;margin:0 auto}
.progress-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.progress-bar .stat{font-size:13px}
.progress-bar .stat b{font-size:20px;display:block;color:var(--primary)}
.progress-bar .bar{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.progress-bar .bar > i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6,#a855f7);transition:width .4s}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.section > h3{margin:0;padding:14px 18px;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.section > h3 .ix{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:12px;font-weight:700}
.section .body{padding:16px 18px}
.scenario{font-size:14px;line-height:1.75;color:var(--text)}
.scenario .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;display:block}

/* CHECKLIST */
.checklist{list-style:none;padding:0;margin:0}
.chk-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
.chk-item:last-child{border-bottom:none}
.chk-box{flex-shrink:0;margin-top:2px;width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);transition:all .15s}
.chk-box:hover{border-color:var(--primary)}
.chk-box.checked{background:var(--success);border-color:var(--success);color:#fff}
.chk-box.checked::after{content:"✓";font-weight:bold;font-size:14px}
.chk-text{flex:1}
.chk-text .title{font-weight:600;font-size:14px}
.chk-text .desc{font-size:13px;color:var(--muted);margin-top:2px}
.chk-item.done .title{text-decoration:line-through;color:var(--muted)}
.chk-note{margin-top:6px;width:100%;min-height:38px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:12px;resize:vertical;outline:none}
.chk-note:focus{border-color:var(--primary)}
.chk-note:placeholder-shown{background:transparent;border-style:dashed}
.chk-actions{display:flex;gap:6px;margin-top:6px}
.mini-btn{font-size:11px;background:transparent;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px}
.mini-btn:hover{background:var(--surface-2);color:var(--text)}

/* TABLES */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.data{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
table.data th{background:var(--surface-2);padding:9px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
table.data td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.data td[contenteditable]:focus{outline:2px solid var(--primary);outline-offset:-2px;background:rgba(37,99,235,.04)}
table.data tr:last-child td{border-bottom:none}
.row-actions{white-space:nowrap;text-align:right;width:60px}
.del-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;opacity:.6;padding:4px 6px;border-radius:4px}
.del-btn:hover{color:var(--danger);opacity:1;background:rgba(220,38,38,.08)}
.add-row{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .15s}
.add-row:hover{border-color:var(--primary);color:var(--primary);background:rgba(37,99,235,.04)}

/* MINI REPORT */
.mini-report{background:linear-gradient(135deg,rgba(37,99,235,.06),rgba(168,85,247,.06));border-left:3px solid var(--primary);padding:14px 18px;border-radius:0 8px 8px 0}
.mini-report textarea{width:100%;min-height:120px;border:none;background:transparent;resize:vertical;font-size:14px;line-height:1.6;outline:none;color:var(--text)}

/* DASHBOARD */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.dash-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.dash-card .val{font-size:24px;font-weight:700;margin-top:4px}
.dash-card.g1 .val{color:var(--g1)}
.dash-card.g2 .val{color:var(--g2)}
.dash-card.g3 .val{color:var(--g3)}
.dash-card.g4 .val{color:var(--g4)}
.dash-card .sub{font-size:11px;color:var(--muted);margin-top:4px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(20px);transition:all .25s;z-index:999;pointer-events:none;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateY(0)}

/* TABS */
.view-tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;border:1px solid var(--border)}
.view-tabs button{background:transparent;border:none;padding:7px 14px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.view-tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}

.disclaimer{padding:10px 14px;background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);border-radius:10px;font-size:12px;color:var(--warn);margin-bottom:18px;display:flex;gap:8px;align-items:center}

/* PRINT */
@media print{
  .sidebar,.topbar .icon-btn,.topbar .btn:not(.print-keep),.menu-btn,.add-row,.del-btn,.row-actions,#toast,.view-tabs,.disclaimer{display:none!important}
  .app{grid-template-columns:1fr}
  .topbar{position:static;border:none;padding:0 0 12px}
  .content{padding:0;max-width:none}
  .section{break-inside:avoid;border:1px solid #ccc;box-shadow:none;margin-bottom:12px}
  body{background:#fff;color:#000}
  .chk-box.checked{background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-theme="light">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>🔍 ACSC Detective</h1>
      <div class="sub">Check List 2026 — Pro Edition</div>
      <span class="badge">15 CASES • 3 GROUPS</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="ค้นหาเคส... (เช่น Romance, ฆ่า, ไฟไหม้)">
    </div>
    <nav class="case-list" id="caseList"></nav>
    <div class="sidebar-footer">
      <span id="overallPct">0% เสร็จ</span>
      <a href="#" id="dashLink">📊 Dashboard</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="case-meta" id="caseMeta">
        <h2>เลือกเคสจากเมนูด้านซ้าย</h2>
        <div class="crumb">หรือดู Dashboard ภาพรวม</div>
      </div>
      <button class="btn icon-btn" id="themeBtn" title="สลับธีม" onclick="toggleTheme()">🌙</button>
      <button class="btn" onclick="exportCurrentJSON()" title="ส่งออกเคสนี้เป็น JSON">📦<span class="label"> Export</span></button>
      <button class="btn" onclick="importJSON()" title="นำเข้าข้อมูล">📥<span class="label"> Import</span></button>
      <button class="btn primary print-keep" onclick="window.print()" title="พิมพ์ / PDF">🖨️<span class="label"> พิมพ์ / PDF</span></button>
      <button class="btn danger" onclick="resetCurrent()" title="รีเซ็ตเคสนี้">↺<span class="label"> รีเซ็ต</span></button>
    </div>
    <div class="content" id="content">
      <!-- rendered by JS -->
    </div>
  </main>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
/* =========================================================
   ACSC Detective Check List 2026 — Professional Edition
   Single-file Web App — Vanilla JS + localStorage
   ========================================================= */

// ---------- STANDARD CHECKLIST (10 items) ----------
const STD_CHECKLIST = [
  {t:"รับเรื่องและกำหนดโจทย์", d:"ระบุเหตุ, ความเสียหาย, พื้นที่เกิดเหตุ, เป้าหมายการสืบสวน"},
  {t:"แยกบุคคลที่เกี่ยวข้อง", d:"ผู้เสียหาย / ผู้ต้องสงสัย / พยาน / ผู้พบเห็น / ผู้เกี่ยวข้องทางอ้อม"},
  {t:"แยกบัญชี เบอร์ อุปกรณ์ และช่องทาง", d:"รวบรวมเลขบัญชี เบอร์โทร โซเชียล อีเมล อุปกรณ์ ยานพาหนะ"},
  {t:"สร้าง Timeline", d:"เรียงเหตุการณ์ก่อน-ระหว่าง-หลังเกิดเหตุ พร้อมเวลาที่อ้างอิงได้"},
  {t:"ทำ Evidence Inventory", d:"กำหนดแหล่งที่มา ผู้ครอบครอง และสถานะความครบถ้วนของพยานหลักฐาน"},
  {t:"ตั้งสมมติฐาน", d:"ตั้งอย่างน้อย 3 แนวทาง พร้อมข้อสนับสนุนและข้อโต้แย้ง"},
  {t:"ตรวจสอบความเชื่อมโยง", d:"เชื่อม คน-เวลา-สถานที่-บัญชี-อุปกรณ์-พฤติการณ์"},
  {t:"กำหนดงานต่อไป", d:"ระบุผู้รับผิดชอบ ลำดับความเร่งด่วน และวันครบกำหนด"},
  {t:"สรุปรายงาน 1 หน้า", d:"สรุปข้อเท็จจริง ประเด็นสืบสวน ความเสี่ยง และข้อเสนอแนะ"},
  {t:"ตรวจทานความถูกต้อง", d:"ตรวจแหล่งอ้างอิง ความสอดคล้องของเวลา และข้อจำกัดของข้อมูล"}
];

// ---------- CASE DATA ----------
const GROUPS = {
  g1:{name:"คดีออนไลน์ / ฉ้อโกง",color:"g1",icon:"💻"},
  g2:{name:"คดีอาชญากรรมทั่วไป",color:"g2",icon:"🏘️"},
  g3:{name:"คดีร้ายแรง / คดีซับซ้อน",color:"g3",icon:"⚠️"},
  g4:{name:"คดีค้ามนุษย์",color:"g4",icon:"🛟"}
};


const CASES = [
  // ========== กลุ่ม 1: คดีออนไลน์/ฉ้อโกง ==========

// ---------- STATE ----------
const STORAGE_KEY = "acsc_checklist_v2";
let state = loadState();
let currentCaseId = state.lastCase || "C01";
let currentView = "case"; // case | dash

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {cases:{}, theme:"light", lastCase:"C01"};
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function getCaseState(id){
  if(!state.cases[id]){
    const base = CASES.find(c=>c.id===id);
    state.cases[id] = {
      checks: STD_CHECKLIST.map(()=>({done:false, note:""})),
      persons: deepCopy(base.persons),
      channels: deepCopy(base.channels),
      timeline: deepCopy(base.timeline),
      evidence: deepCopy(base.evidence),
      hypothesis: deepCopy(base.hypothesis),
      actions: deepCopy(base.actions),
      report: base.report
    };
  }
  return state.cases[id];
}
function deepCopy(x){return JSON.parse(JSON.stringify(x))}

// ---------- TOAST ----------
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// ---------- THEME ----------
function applyTheme(){
  document.body.setAttribute('data-theme', state.theme||'light');
  document.getElementById('themeBtn').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  applyTheme(); saveState();
}

// ---------- SIDEBAR ----------
function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  const open = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
  // lock body scroll when sidebar is open on mobile
  if(open && window.innerWidth <= 980){
    document.body.classList.add('no-scroll');
  } else {
    document.body.classList.remove('no-scroll');
  }
}

function renderSidebar(filter=""){
  const list = document.getElementById('caseList');
  const groups = {g1:[],g2:[],g3:[]};
  const f = filter.trim().toLowerCase();
  CASES.forEach(c=>{
    if(f && !(c.title.toLowerCase().includes(f) || c.id.toLowerCase().includes(f) || c.scenario.toLowerCase().includes(f))) return;
    groups[c.group].push(c);
  });
  let html="";
  Object.keys(GROUPS).forEach(gk=>{
    if(!groups[gk].length) return;
    const g=GROUPS[gk];
    html += `<div class="group-title"><span class="dot" style="background:var(--${gk})"></span>${g.icon} ${g.name}</div>`;
    groups[gk].forEach(c=>{
      const cs=getCaseState(c.id);
      const done=cs.checks.filter(x=>x.done).length;
      const pct=Math.round(done/STD_CHECKLIST.length*100);
      html += `<div class="case-item ${c.id===currentCaseId&&currentView==='case'?'active':''}" data-id="${c.id}">
        <span class="code">${c.id}</span>
        <span class="ttl">${c.title}</span>
        <div style="text-align:right">
          <div class="pct">${pct}%</div>
          <div class="progress-mini"><i style="width:${pct}%"></i></div>
        </div>
      </div>`;
    });
  });
  if(!html) html = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">ไม่พบเคสที่ค้นหา</div>`;
  list.innerHTML = html;
  list.querySelectorAll('.case-item').forEach(el=>{
    el.onclick = ()=>{
      currentCaseId = el.dataset.id;
      currentView = "case";
      state.lastCase = currentCaseId; saveState();
      renderSidebar(document.getElementById('search').value);
      renderMain();
      if(window.innerWidth<=980) toggleSidebar(false);
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
  // overall progress
  let totalDone=0,totalAll=0;
  CASES.forEach(c=>{
    const cs=getCaseState(c.id);
    totalDone += cs.checks.filter(x=>x.done).length;
    totalAll += STD_CHECKLIST.length;
  });
  const opct = Math.round(totalDone/totalAll*100);
  document.getElementById('overallPct').textContent = `รวม ${opct}%`;
}

// ---------- MAIN RENDER ----------
function renderMain(){
  const c = CASES.find(x=>x.id===currentCaseId);
  if(currentView==='dash'){ renderDashboard(); return; }
  const cs = getCaseState(c.id);
  const g = GROUPS[c.group];
  document.getElementById('caseMeta').innerHTML = `
    <h2><span class="tag ${c.group}">${g.icon} ${g.name}</span> ${c.id} — ${c.title}</h2>
    <div class="crumb">บันทึกอัตโนมัติเมื่อแก้ไข • Local Storage</div>
  `;

  const done = cs.checks.filter(x=>x.done).length;
  const pct = Math.round(done/STD_CHECKLIST.length*100);

  let html=`
  <div class="disclaimer">
    <span>⚠️</span>
    <span><b>หมายเหตุ:</b> เคสทั้งหมดเป็นตัวอย่างสมมติ ใช้เพื่อการฝึกอบรมเท่านั้น • ข้อมูลที่กรอกจะถูกเก็บไว้ในเบราว์เซอร์ของคุณ (Local Storage)</span>
  </div>

  <div class="progress-bar">
    <div class="stat"><b>${done}/${STD_CHECKLIST.length}</b><span style="color:var(--muted);font-size:11px">รายการเสร็จ</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stat" style="text-align:right"><b style="color:var(--success)">${pct}%</b><span style="color:var(--muted);font-size:11px">ความคืบหน้า</span></div>
  </div>

  <div class="section">
    <h3><span class="ix">1</span>Scenario / สถานการณ์สมมติ</h3>
    <div class="body">
      <div class="scenario" contenteditable="true" data-field="scenario">${escapeHTML(c.scenario)}</div>
    </div>
  </div>

  <div class="section">
    <h3><span class="ix">2</span>Checklist ตัวอย่าง <span style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:400">(${done}/${STD_CHECKLIST.length})</span></h3>
    <div class="body">
      <ul class="checklist" id="chkList">
        ${STD_CHECKLIST.map((it,i)=>{
          const v=cs.checks[i]||{done:false,note:""};
          return `<li class="chk-item ${v.done?'done':''}">
            <span class="chk-box ${v.done?'checked':''}" data-i="${i}"></span>
            <div class="chk-text">
              <div class="title">${i+1}. ${escapeHTML(it.t)}</div>
              <div class="desc">${escapeHTML(it.d)}</div>
              <textarea class="chk-note" data-i="${i}" placeholder="บันทึกเพิ่มเติม / คำสั่ง / ผู้รับผิดชอบ...">${escapeHTML(v.note||"")}</textarea>
            </div>
          </li>`;
        }).join('')}
      </ul>
    </div>
  </div>

  ${tableSection(3, "บุคคล / หน่วยเกี่ยวข้อง", "persons", ["ชื่อ / ฝ่าย","บทบาท","หมายเหตุ"], cs.persons)}
  ${tableSection(4, "บัญชี / อุปกรณ์ / ช่องทาง / สถานที่", "channels", ["ประเภท","รายละเอียด","หมายเหตุ"], cs.channels)}
  ${tableSection(5, "Timeline", "timeline", ["เวลา / วันที่","เหตุการณ์"], cs.timeline)}
  ${tableSection(6, "Evidence Inventory", "evidence", ["พยานหลักฐาน","แหล่งที่มา","สถานะ","หมายเหตุ"], cs.evidence)}
  ${tableSection(7, "Hypothesis Board", "hypothesis", ["สมมติฐาน","ข้อสนับสนุน","แนวทางตรวจสอบ"], cs.hypothesis)}
  ${tableSection(8, "Action Log", "actions", ["งาน","ผู้รับผิดชอบ","ความเร่งด่วน","สถานะ","หมายเหตุ"], cs.actions)}

  <div class="section">
    <h3><span class="ix">9</span>Mini Report สรุป</h3>
    <div class="body">
      <div class="mini-report">
        <textarea data-field="report" placeholder="สรุปข้อเท็จจริง ประเด็นสืบสวน ความเสี่ยง และข้อเสนอแนะ...">${escapeHTML(cs.report||"")}</textarea>
      </div>
    </div>
  </div>
  `;
  document.getElementById('content').innerHTML = html;
  bindCaseEvents();
}

function tableSection(ix, title, field, headers, rows){
  return `<div class="section">
    <h3><span class="ix">${ix}</span>${title}</h3>
    <div class="body">
      <div class="tbl-wrap">
        <table class="data" data-tbl="${field}">
          <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th class="row-actions"></th></tr></thead>
          <tbody>
            ${rows.map((r,ri)=>tableRow(field,headers,r,ri)).join('')}
          </tbody>
        </table>
      </div>
      <button class="add-row" data-add="${field}" data-cols="${headers.length}">＋ เพิ่มแถว</button>
    </div>
  </div>`;
}
function tableRow(field,headers,r,ri){
  const cells = headers.map((_,ci)=>`<td contenteditable="true" data-r="${ri}" data-c="${ci}">${escapeHTML(r[ci]||"")}</td>`).join('');
  return `<tr>${cells}<td class="row-actions"><button class="del-btn" data-del="${field}" data-r="${ri}" title="ลบแถว">🗑️</button></td></tr>`;
}

function escapeHTML(s){
  return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

// ---------- BIND EVENTS (case page) ----------
function bindCaseEvents(){
  const cs = getCaseState(currentCaseId);

  // checkboxes
  document.querySelectorAll('.chk-box').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i;
      cs.checks[i].done = !cs.checks[i].done;
      saveState();
      b.classList.toggle('checked', cs.checks[i].done);
      b.closest('.chk-item').classList.toggle('done', cs.checks[i].done);
      renderSidebar(document.getElementById('search').value);
      // update progress bar
      const done = cs.checks.filter(x=>x.done).length;
      const pct = Math.round(done/STD_CHECKLIST.length*100);
      const bar = document.querySelector('.progress-bar');
      if(bar){
        bar.querySelector('.stat b').textContent = `${done}/${STD_CHECKLIST.length}`;
        bar.querySelector('.bar > i').style.width = pct+"%";
        bar.querySelector('.stat:last-child b').textContent = pct+"%";
      }
      const head = document.querySelector('.section h3 span[style*="auto"]');
      if(head) head.textContent = `(${done}/${STD_CHECKLIST.length})`;
    };
  });

  // notes
  document.querySelectorAll('.chk-note').forEach(t=>{
    t.oninput = ()=>{
      const i = +t.dataset.i;
      cs.checks[i].note = t.value;
      saveState();
    };
  });

  // scenario / report editable
  document.querySelectorAll('[data-field]').forEach(el=>{
    const ev = el.tagName==='TEXTAREA' ? 'input' : 'blur';
    el.addEventListener(ev, ()=>{
      const f = el.dataset.field;
      cs[f] = el.tagName==='TEXTAREA' ? el.value : el.innerText.trim();
      saveState();
    });
  });

  // table cells
  document.querySelectorAll('table.data').forEach(tbl=>{
    const field = tbl.dataset.tbl;
    tbl.querySelectorAll('td[contenteditable]').forEach(td=>{
      td.addEventListener('blur', ()=>{
        const r=+td.dataset.r, c=+td.dataset.c;
        if(!cs[field][r]) cs[field][r]=[];
        cs[field][r][c] = td.innerText.trim();
        saveState();
      });
    });
  });

  // add row
  document.querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = ()=>{
      const f=b.dataset.add, cols=+b.dataset.cols;
      cs[f].push(new Array(cols).fill(""));
      saveState();
      renderMain();
      // focus last row first cell
      setTimeout(()=>{
        const tbl = document.querySelector(`table[data-tbl="${f}"]`);
        if(tbl){
          const rows = tbl.querySelectorAll('tbody tr');
          const lastRow = rows[rows.length-1];
          if(lastRow) lastRow.querySelector('td[contenteditable]').focus();
        }
      },50);
    };
  });

  // delete row
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{
      const f=b.dataset.del, r=+b.dataset.r;
      if(!confirm("ลบแถวนี้?")) return;
      cs[f].splice(r,1);
      saveState();
      renderMain();
      toast("ลบแถวแล้ว");
    };
  });
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  document.getElementById('caseMeta').innerHTML = `
    <h2>📊 Dashboard ภาพรวม</h2>
    <div class="crumb">สรุปความคืบหน้าทั้ง 15 เคส</div>
  `;
  let totalDone=0, totalAll=0;
  const groupStats = {g1:{d:0,a:0,n:0}, g2:{d:0,a:0,n:0}, g3:{d:0,a:0,n:0}};
  CASES.forEach(c=>{
    const cs=getCaseState(c.id);
    const d=cs.checks.filter(x=>x.done).length;
    const a=STD_CHECKLIST.length;
    totalDone+=d; totalAll+=a;
    groupStats[c.group].d+=d; groupStats[c.group].a+=a; groupStats[c.group].n++;
  });
  const opct = Math.round(totalDone/totalAll*100);

  let html = `
    <div class="dash">
      <div class="dash-card">
        <div class="lbl">เคสทั้งหมด</div>
        <div class="val">${CASES.length}</div>
        <div class="sub">3 กลุ่มคดี</div>
      </div>
      <div class="dash-card">
        <div class="lbl">ความคืบหน้ารวม</div>
        <div class="val">${opct}%</div>
        <div class="sub">${totalDone} / ${totalAll} รายการ</div>
      </div>
      <div class="dash-card g1">
        <div class="lbl">${GROUPS.g1.icon} กลุ่ม 1 — ออนไลน์/ฉ้อโกง</div>
        <div class="val">${Math.round(groupStats.g1.d/groupStats.g1.a*100)}%</div>
        <div class="sub">${groupStats.g1.n} เคส</div>
      </div>
      <div class="dash-card g2">
        <div class="lbl">${GROUPS.g2.icon} กลุ่ม 2 — ทั่วไป</div>
        <div class="val">${Math.round(groupStats.g2.d/groupStats.g2.a*100)}%</div>
        <div class="sub">${groupStats.g2.n} เคส</div>
      </div>
      <div class="dash-card g3">
        <div class="lbl">${GROUPS.g3.icon} กลุ่ม 3 — ร้ายแรง</div>
        <div class="val">${Math.round(groupStats.g3.d/groupStats.g3.a*100)}%</div>
        <div class="sub">${groupStats.g3.n} เคส</div>
      </div>
    </div>

    <div class="section">
      <h3><span class="ix">📋</span>ความคืบหน้ารายเคส</h3>
      <div class="body">
        <div class="tbl-wrap">
          <table class="data">
            <thead><tr><th>รหัส</th><th>กลุ่ม</th><th>ชื่อเคส</th><th style="width:120px">ความคืบหน้า</th><th style="width:60px">%</th><th></th></tr></thead>
            <tbody>
              ${CASES.map(c=>{
                const cs=getCaseState(c.id);
                const d=cs.checks.filter(x=>x.done).length;
                const pct=Math.round(d/STD_CHECKLIST.length*100);
                const g=GROUPS[c.group];
                return `<tr data-go="${c.id}" style="cursor:pointer">
                  <td><b>${c.id}</b></td>
                  <td><span class="tag ${c.group}">${g.icon}</span></td>
                  <td>${escapeHTML(c.title)}</td>
                  <td><div style="height:8px;background:var(--surface-2);border-radius:4px;border:1px solid var(--border);overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#22c55e,#3b82f6)"></div></div></td>
                  <td><b>${pct}%</b></td>
                  <td>→</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="section">
      <h3><span class="ix">⚙️</span>การจัดการข้อมูล</h3>
      <div class="body" style="display:flex;flex-wrap:wrap;gap:10px">
        <button class="btn" onclick="exportAllJSON()">📦 Export ข้อมูลทุกเคส (JSON)</button>
        <button class="btn" onclick="importJSON()">📥 Import ข้อมูล</button>
        <button class="btn" onclick="exportAllCSV()">📊 Export Action Log (CSV)</button>
        <button class="btn danger" onclick="resetAll()">🗑️ ล้างข้อมูลทั้งหมด</button>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('[data-go]').forEach(tr=>{
    tr.onclick = ()=>{
      currentCaseId = tr.dataset.go;
      currentView = "case";
      state.lastCase = currentCaseId; saveState();
      renderSidebar(document.getElementById('search').value);
      renderMain();
    };
  });
}

// ---------- ACTIONS ----------
function resetCurrent(){
  if(!confirm(`รีเซ็ตข้อมูลเคส ${currentCaseId} ทั้งหมด?\nข้อมูลที่แก้ไขจะหายไป`)) return;
  delete state.cases[currentCaseId];
  saveState();
  getCaseState(currentCaseId);
  renderMain();
  renderSidebar(document.getElementById('search').value);
  toast("รีเซ็ตเคสแล้ว");
}
function resetAll(){
  if(!confirm("ล้างข้อมูลทุกเคส? การกระทำนี้ย้อนกลับไม่ได้")) return;
  if(!confirm("ยืนยันอีกครั้ง?")) return;
  state.cases = {};
  saveState();
  renderSidebar();
  if(currentView==='dash') renderDashboard(); else renderMain();
  toast("ล้างข้อมูลทั้งหมดแล้ว");
}
function exportCurrentJSON(){
  const c = CASES.find(x=>x.id===currentCaseId);
  const cs = getCaseState(currentCaseId);
  const data = {meta:{id:c.id,title:c.title,group:c.group,exportedAt:new Date().toISOString()}, scenario:cs.scenario||c.scenario, checklist:STD_CHECKLIST.map((it,i)=>({...it, ...cs.checks[i]})), persons:cs.persons, channels:cs.channels, timeline:cs.timeline, evidence:cs.evidence, hypothesis:cs.hypothesis, actions:cs.actions, report:cs.report};
  download(`${c.id}_${c.title}.json`, JSON.stringify(data,null,2), 'application/json');
  toast("ส่งออก JSON สำเร็จ");
}
function exportAllJSON(){
  const out = {exportedAt:new Date().toISOString(), cases:{}};
  CASES.forEach(c=>{
    const cs = getCaseState(c.id);
    out.cases[c.id] = {title:c.title, group:c.group, ...cs};
  });
  download(`acsc_all_cases_${Date.now()}.json`, JSON.stringify(out,null,2), 'application/json');
  toast("ส่งออกทุกเคสสำเร็จ");
}
function exportAllCSV(){
  const lines = ["Case,Title,Task,Owner,Priority,Status,Note"];
  CASES.forEach(c=>{
    const cs = getCaseState(c.id);
    cs.actions.forEach(a=>{
      const row = [c.id, c.title, ...a].map(x=>`"${String(x||"").replace(/"/g,'""')}"`).join(',');
      lines.push(row);
    });
  });
  download(`acsc_actions_${Date.now()}.csv`, "\uFEFF"+lines.join("\n"), 'text/csv');
  toast("ส่งออก CSV สำเร็จ");
}
function importJSON(){
  document.getElementById('fileInput').click();
}
document.getElementById('fileInput').onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(data.cases){
        // multi-case
        Object.keys(data.cases).forEach(id=>{
          const d = data.cases[id];
          state.cases[id] = {checks:d.checks||STD_CHECKLIST.map(()=>({done:false,note:""})), persons:d.persons||[], channels:d.channels||[], timeline:d.timeline||[], evidence:d.evidence||[], hypothesis:d.hypothesis||[], actions:d.actions||[], report:d.report||"", scenario:d.scenario||""};
        });
        toast(`นำเข้า ${Object.keys(data.cases).length} เคส`);
      } else if(data.meta && data.meta.id){
        const id=data.meta.id;
        state.cases[id] = {checks:(data.checklist||[]).map(x=>({done:!!x.done, note:x.note||""})), persons:data.persons||[], channels:data.channels||[], timeline:data.timeline||[], evidence:data.evidence||[], hypothesis:data.hypothesis||[], actions:data.actions||[], report:data.report||"", scenario:data.scenario||""};
        currentCaseId = id; currentView="case";
        toast(`นำเข้าเคส ${id}`);
      }
      saveState();
      renderSidebar(document.getElementById('search').value);
      renderMain();
    }catch(err){ toast("ไฟล์ไม่ถูกต้อง"); }
  };
  r.readAsText(f);
  e.target.value = "";
};
function download(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ---------- INIT ----------
document.getElementById('search').oninput = (e)=>renderSidebar(e.target.value);
document.getElementById('dashLink').onclick = (e)=>{
  e.preventDefault();
  currentView = "dash";
  renderSidebar(document.getElementById('search').value);
  document.querySelectorAll('.case-item').forEach(el=>el.classList.remove('active'));
  renderDashboard();
};

applyTheme();
renderSidebar();
renderMain();

// keyboard shortcut: ESC to close mobile sidebar
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') toggleSidebar(false);
  if((e.ctrlKey||e.metaKey) && e.key==='p'){ /* let browser handle print */ }
  if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); document.getElementById('search').focus(); }
});

// auto-close sidebar / unlock scroll when resizing back to desktop
window.addEventListener('resize', ()=>{
  if(window.innerWidth > 980){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
    document.body.classList.remove('no-scroll');
  }
});

// dashboard link should also close sidebar on mobile
document.getElementById('dashLink').addEventListener('click', ()=>{
  if(window.innerWidth<=980) toggleSidebar(false);
});
</script>
</body>
</html>
